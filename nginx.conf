log_format faceit_oauth 'faceit_oauth_callback http=$status';

# Socket.IO necesita reenviar el upgrade de HTTP a WebSocket. El valor por
# defecto cierra la conexión para peticiones HTTP normales (sondeo).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Las demos de CS2 pueden pesar cientos de MB y se suben por la API.
    # El backend valida el límite real (MATCHMAKING_MAX_UPLOAD_MB); nginx solo
    # necesita permitir el cuerpo. Ajustar ambos valores en conjunto.
    client_max_body_size 512m;

    # No registrar code/state ni reenviarlos como Referer a otros recursos.
    # El backend registra los errores OAuth con categorías sanitizadas.
    location = /api/faceit/oauth/callback {
        access_log /var/log/nginx/access.log faceit_oauth;
        error_log /dev/null;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:5000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy inverso de la API: Flask corre en la red interna de Docker como
    # servicio "backend" (puerto interno 5000). Al usar una variable en
    # proxy_pass, nginx resuelve el nombre DNS en cada petición (sobrevive a
    # recreaciones del backend) y transmite la URI original intacta: el
    # prefijo /api/ se preserva sin eliminarlo ni duplicarlo.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:5000;
        proxy_pass $backend_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Servicio realtime (NestJS + Socket.IO). Solo se publican el socket y su
    # health; la API interna /internal/ nunca se expone a través de nginx.
    location /realtime/socket.io/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $realtime_upstream http://realtime:3000;
        proxy_pass $realtime_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Conexiones largas: el heartbeat de Socket.IO mantiene vivo el socket.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /realtime/health {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $realtime_upstream http://realtime:3000;
        proxy_pass $realtime_upstream/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # La API interna servicio-a-servidor jamás debe ser accesible desde fuera.
    location /internal/ {
        return 404;
    }

    # El HTML no se cachea: un nuevo deploy debe verse al recargar.
    location = /index.html {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Assets generados por Vite: nombre con hash, cache agresivo.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Fallback SPA: cualquier ruta del router devuelve index.html.
    # /teams, /maps, /teams/:id/lineups, /players/:id, etc. funcionan al
    # entrar directo o recargar.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
